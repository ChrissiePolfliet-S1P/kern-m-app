<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kern•m•app</title>
<meta name="theme-color" content="#007a23">
<meta name="description" content="Reflectievragen vanuit theoretische kaders">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kern•m•app">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@700&display=swap" rel="stylesheet">
<style>
:root{--groen:#007a23;--rood:#d64b37;--geel:#ec9801;--petrol:#2a7174;--blauw:#33a6c0;--beige:#e6e4d4;--grijs:#dad9d5;--wit:#f3f3f3;--ink:#23312a;--accent:var(--groen)}
*{box-sizing:border-box}
body{margin:0;background:var(--beige);color:var(--ink);font:11pt Calibri,Carlito,'Segoe UI',sans-serif;min-height:100vh;line-height:1.5;
background-image:radial-gradient(circle at 100% 0,rgba(51,166,192,.18) 0 140px,transparent 141px),radial-gradient(circle at 0 100%,rgba(236,152,1,.16) 0 120px,transparent 121px);background-attachment:fixed}
h1,h2,h3{font-family:'Roboto Slab',Georgia,serif;font-weight:700;margin:0 0 .5em}
h1{font-size:14pt}h2{font-size:14pt}h3{font-size:12pt}
header{background:var(--accent);color:var(--wit);padding:14px 22px;display:flex;align-items:center;gap:14px;border-radius:0 0 28px 28px;box-shadow:0 6px 18px rgba(35,49,42,.15);max-width:900px;margin:0 auto}
.back{flex:none;width:44px;height:44px;border:0;background:none;color:var(--wit);display:grid;place-items:center;padding:0;cursor:pointer;transition:transform .15s}
.back:hover{transform:translateY(-2px)}
.inst{flex:none;font:700 10pt Calibri,Carlito,sans-serif;color:var(--ink);background:var(--geel);border:0;border-radius:999px;padding:6px 14px;cursor:pointer}
.inst:hover{filter:brightness(1.08)}
header h1{margin:0;flex:1;letter-spacing:.2px}
header svg{width:40px;height:40px;flex:none}
main{max-width:720px;margin:0 auto;padding:28px 16px 60px}
.card{background:var(--wit);border:1.5px solid rgba(35,49,42,.18);border-radius:24px;box-shadow:0 8px 24px rgba(35,49,42,.08);padding:24px;margin-bottom:18px;position:relative;overflow:hidden}
.card.big::before{content:"";position:absolute;top:-34px;right:-34px;width:100px;height:100px;border-radius:50%;background:var(--accent);opacity:.14}
.card.big::after{content:"";position:absolute;top:18px;right:18px;width:14px;height:14px;border-radius:50%;background:var(--geel)}
.stack{display:flex;flex-direction:column;gap:14px}
.fw{display:flex;align-items:center;gap:18px;width:100%;cursor:pointer;text-align:left;font:inherit;color:var(--ink);margin:0;padding:18px 22px;transition:transform .15s,box-shadow .15s}
.fw:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(35,49,42,.14)}
.fw .badge{flex:none;width:52px;height:52px}
.fw .txt{flex:1}.fw h2{margin:0 0 2px}.fw p{margin:0}
button.btn{font:700 11pt Calibri,Carlito,sans-serif;background:var(--accent);color:#fff;border:0;border-radius:999px;padding:10px 22px;cursor:pointer;margin:4px 8px 4px 0;transition:transform .12s,filter .12s}
button.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
button.btn.alt{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px rgba(35,49,42,.3)}
button.btn.geel{background:var(--geel);color:var(--ink)}
.chip{display:inline-block;border-radius:999px;padding:2px 14px;font-size:10pt;font-weight:700;color:#fff;background:var(--petrol);margin:0 6px 8px 0}
.vraag{font-family:'Roboto Slab',Georgia,serif;font-weight:700;font-size:14pt;line-height:1.4;margin:8px 0 18px;max-width:90%}
textarea{width:100%;min-height:150px;font:11pt Calibri,Carlito,sans-serif;padding:14px;border:1.5px solid rgba(35,49,42,.25);border-radius:18px;background:#fff;resize:vertical;outline:none}
textarea:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(0,122,35,.12)}
.hist{background:var(--beige);border-radius:14px;padding:10px 16px;margin:8px 0;position:relative}
.ht{white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;line-clamp:3;overflow:hidden}
.ht.open{display:block;-webkit-line-clamp:unset;line-clamp:unset}
.qitem{display:block;width:100%;text-align:left;font:inherit;color:var(--ink);background:#fff;border:1.5px solid rgba(35,49,42,.18);border-radius:16px;padding:12px 16px;margin:8px 0;cursor:pointer;transition:border-color .15s,transform .15s}
.qitem:hover{border-color:var(--accent);transform:translateX(3px)}
.qitem small{display:block;opacity:.7;font-weight:700;margin-top:4px}
button.chip{border:0;font-family:inherit}
.chip.link{cursor:pointer}.chip.link:hover{filter:brightness(1.12)}
.qitem.off{opacity:.65;cursor:default;background:var(--grijs)}
.qitem.off:hover{transform:none;border-color:rgba(35,49,42,.18)}
header h1{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:480px){header h1{white-space:normal;font-size:12pt;line-height:1.15}header{padding:12px 14px;gap:8px}header .orglogo{padding:3px 7px;border-radius:12px}header .orglogo img{height:30px}}
.orglogo{flex:none;background:#fff;border-radius:14px;padding:4px 10px;display:flex;align-items:center}
.orglogo{text-decoration:none;cursor:pointer}
.orglogo img{height:36px;width:auto;display:block}
.gearwrap{position:relative;flex:none}
.gear{width:44px;height:44px;border:0;background:none;display:grid;place-items:center;padding:0;cursor:pointer;transition:transform .3s}
.gear svg{width:32px;height:32px}
.gear:hover,.gear[aria-expanded=true]{transform:rotate(22.5deg)}
.menu{position:absolute;right:0;top:calc(100% + 10px);width:min(300px,calc(100vw - 32px));background:var(--wit);color:var(--ink);border-radius:18px;box-shadow:0 12px 32px rgba(35,49,42,.22);border:1.5px solid rgba(35,49,42,.15);padding:8px;z-index:50}
.menu[hidden]{display:none}
.menu .mh{font:700 10pt 'Roboto Slab',Georgia,serif;opacity:.6;padding:6px 12px 4px}
.menu button{display:block;width:100%;text-align:left;font:11pt Calibri,Carlito,sans-serif;color:var(--ink);background:none;border:0;border-radius:12px;padding:10px 12px;cursor:pointer}
.menu button:hover{background:var(--beige)}
.menu button.danger{color:var(--rood)}
.menu .mh+button,.menu input+.mh{margin-top:0}
.menu input+.mh{margin-top:6px;border-top:1px solid rgba(35,49,42,.12);padding-top:10px}
.mconf{display:flex;gap:8px;margin:2px 12px 8px}
.mconf button{width:auto;flex:1;text-align:center;font-weight:700;border-radius:999px;padding:8px 10px}
.mconf .yes{background:var(--rood);color:#fff}.mconf .yes:hover{background:var(--rood);filter:brightness(1.08)}
.mconf .nee{box-shadow:inset 0 0 0 2px rgba(35,49,42,.3)}
.msum{font-size:10pt;opacity:.7;margin:6px 12px 2px}
#bkmsg p{margin:4px 12px 6px;font-size:10pt}
#bkmsg .ok{color:var(--groen);font-weight:700}
#bkmsg .no{color:var(--rood);font-weight:700}
.pg h3{font-size:14pt;margin-bottom:.3em}
.pg .wh{margin-bottom:6px}.pg .noot{opacity:.75;margin-left:2px}
.dots{list-style:none;margin:6px 0 0;padding:0}
.dots li{position:relative;padding:0 0 10px 26px}
.dots li::before{content:"";position:absolute;left:4px;top:.5em;width:9px;height:9px;border-radius:50%;background:var(--accent)}
.kw{color:var(--groen)}
.undo{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;background:var(--beige);border-radius:16px;padding:8px 8px 8px 16px;margin:0 0 14px}
.undo .btn{margin:0}
.star{background:none;border:0;padding:4px;cursor:pointer;line-height:0;border-radius:50%}
.star:hover{background:rgba(236,152,1,.18)}
.vraag .star{display:inline-block;vertical-align:middle;margin-left:2px}
.qrow{position:relative;margin:8px 0;background:#fff;border:1.5px solid rgba(35,49,42,.18);border-radius:16px;transition:border-color .15s}
.qrow:hover{border-color:var(--accent)}
.qrow .qitem{margin:0;border:0;background:transparent;border-radius:16px;padding-right:52px}
.qrow .qitem:hover{transform:none}
.qrow .star{position:absolute;top:8px;right:8px}
.qrow.off{background:var(--grijs)}.qrow.off:hover{border-color:rgba(35,49,42,.18)}
.qrow .qitem.off{opacity:.65;background:transparent}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 20px;border-radius:999px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:200;max-width:calc(100vw - 32px);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.menu .xopt{background:var(--beige);margin:6px 0}.menu .xopt b{display:block}.menu .xopt small{opacity:.75}
.menu .xno{text-align:center;opacity:.7}
#printArea{display:none}
@media print{body>*:not(#printArea){display:none!important}body{background:#fff!important}
 #printArea{display:block!important;color:#000;font:11pt Calibri,Carlito,sans-serif}
 #printArea h1{font:700 20pt 'Roboto Slab',Georgia,serif;color:#007a23;margin:0}
 #printArea h2{font:700 14pt 'Roboto Slab',Georgia,serif;margin:2pt 0}
 #printArea .pm{color:#555;margin:0 0 14pt}
 #printArea .pi{break-inside:avoid;margin:0 0 12pt;padding-bottom:8pt;border-bottom:1px solid #bbb}
 #printArea .pq{font:700 12pt 'Roboto Slab',Georgia,serif}
 #printArea .pc{color:#2a7174;font-weight:700;font-size:10pt}
 #printArea .pd{color:#666;font-size:9.5pt;margin-bottom:4pt}
 #printArea .pa{white-space:pre-wrap}}
.ahead{margin-bottom:4px}.ahead b{display:block;margin-bottom:4px}
.ahead .chip{font-size:9pt;padding:1px 10px;margin:0 5px 4px 0}
.arow{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;margin-top:4px}
.arow .more{padding:2px 0}.arow .no{font-weight:700;color:var(--rood)}
button.btn.sm{padding:6px 14px;font-size:10pt;margin:2px 6px 2px 0}
button.btn.danger{background:var(--rood);color:#fff}
.editta{min-height:100px;margin:6px 0 4px}.editta.bad{border-color:var(--rood)}
#asearch{width:100%;font:inherit;padding:10px 16px;border:1.5px solid rgba(35,49,42,.25);border-radius:999px;background:#fff;margin:8px 0 10px;outline:none}
#asearch:focus{border-color:var(--accent)}
.more{background:none;border:0;padding:4px 0 0;margin:0;font:700 10pt Calibri,Carlito,sans-serif;color:var(--accent);cursor:pointer}
.more:hover{text-decoration:underline}
.hist::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:4px;border-radius:4px;background:var(--accent)}
.hist small{display:block;font-weight:700;opacity:.65;margin-bottom:3px}
.info{background:var(--beige);border-radius:18px;padding:14px 18px;margin:14px 0}
.info p{margin:0 0 .9em}.info p:last-child{margin-bottom:0}
.atoomv{display:block;width:100%;max-width:460px;height:auto;margin:6px auto 0;-webkit-mask-image:linear-gradient(to right,transparent,#000 3%,#000 97%,transparent);mask-image:linear-gradient(to right,transparent,#000 3%,#000 97%,transparent)}
.doqv{display:block;width:100%;height:auto;margin-top:6px}
.info h3.pt{color:var(--groen)}
.info ul.bl{margin:0 0 .9em;padding-left:1.3em}.info ul.bl li{margin:.1em 0}
.pick{display:flex;flex-wrap:wrap;gap:4px}
.err{color:var(--rood);font-weight:700}
.card.err{border-color:var(--rood)}
.muted{opacity:.7}
.saved{color:var(--groen);font-weight:700;margin:0 0 10px}
</style>
</head>

  pijlerInfo:[
   {match:['krachtgericht','netwerkversterkend'],kleur:'#007a23',titel:'Pijler 1: Krachtgericht en netwerkversterkend werken',tekst:`Onze kwaliteitspijlers krijgen vorm vanuit twee centrale benaderingen: krachtgericht en netwerkversterkend werken. Zij vormen de kern van ons handelen en geven richting aan de wijze waarop we met het gezin en hun omgeving op weg gaan.

**Krachtgericht werken** is in essentie een basishouding die we aannemen in de relatie met het gezinslid, onszelf en het bredere netwerk. Als hulpverlener verkennen we in de verhalen van de cliënt – over zichzelf en de context – wat er goed gaat, sterktes, vaardigheden, waarden en helpende overtuigingen.

Door krachtgericht te observeren, te luisteren én door te vragen, verkennen we wat wél werkt. Dit doen we steeds in combinatie met de nodige erkenning voor de bestaande moeilijkheden en zorgen. Met deze benadering voegen we hoopvolle betekenissen toe aan de levensverhalen van de cliënten.

**Netwerkversterkend werken** richt zich op de bredere omgeving van het gezin, zoals familie, vrienden, school en de buurt. Door dit sociale netwerk te verkennen, te verbreden en te verdiepen, brengen we de steunbronnen van de gezinsleden in kaart. Het gezin bepaalt hierbij zelf hoe dit netwerk van waarde is, of kan zijn, voor het realiseren van hun gewenste leven.`},
   {match:['regie','aanhetstuur'],kleur:'#ec9801',titel:'Pijler 2: Regie bij het gezin',tekst:`De vragen en doelen van het gezin vormen ons kompas. We sluiten aan bij hun waarden, mogelijkheden en tempo, met oog voor de draagkracht van elk gezinslid. We laten de regie bij hen en zetten hen maximaal aan het stuur. Wat die regie precies inhoudt, verschilt per gezin en vraagt daarom maatwerk. Als de draagkracht overschreden is, bieden we in samenspraak met het gezin tijdelijk extra sturing.

**Wat streven we na?**

**1. Samenredzaamheid**
Het gezin en hun netwerk bundelen de krachten, zodat er stelselmatig minder behoefte is aan professionele hulp.

**2. Participatieve samenwerking**
We praten niet over het gezin, maar mét het gezin. Hierbij werken we volgens het principe: samen weten, samen denken, samen doen.

**3. Weloverwogen keuzes**
Gezinnen krijgen overzichtelijke en begrijpelijke informatie. Zo weten ze precies waar ze aan toe zijn en kunnen ze keuzes maken die bij hen passen.`},
   {match:['flexibele','nabije'],kleur:'#d64b37',titel:'Pijler 3: Flexibele en nabije hulp',tekst:`**Flexibele hulp** betekent dat we de begeleiding samen met het gezin vormgeven, op hun maat. Vanuit onze generalistische expertise schakelen we tijdig bij met de meest passende hulp. We stemmen de doelen af op hun noden en gebruiken onze creativiteit om maatwerk te bieden. Tegelijk vraagt flexibiliteit om een duidelijk speelveld: we maken verwachtingen helder, volgen afspraken op en blijven liefdevol consequent wanneer er spanning ontstaat.

**Nabije hulp** vertrekt vanuit de leefwereld van het gezin. We werken laagdrempelig, zijn vlot bereikbaar en zorgen dat kinderen, jongeren en ouders zich gehoord voelen. Zonder meer hulp toe te voegen dan nodig, versterken we de krachten in en rond het gezin. Zo helpen we het gewone leven weer vooruit, zonder het over te nemen.

**Wat streven we na?**

**1. Passende hulp op het juiste moment**
Binnen de grenzen van onze opdracht benutten we onze ruimte om buiten de lijntjes te kleuren. We sluiten aan bij wat het gezin op dat moment nodig heeft, terwijl heldere afspraken ervoor zorgen dat de focus behouden blijft.

**2. Aansluiting bij hun leefwereld**
We organiseren de ondersteuning waar het dagelijkse leven zich afspeelt: van de keukentafel tot de school, in de buurt en daarbuiten. Zo maken we de hulp herkenbaar, toegankelijk en dichtbij.

**3. Authentieke verbinding**
Kinderen, jongeren en ouders voelen dat we er écht zijn voor hen. We bieden een veilige basis waar elke vraag of bezorgdheid gedeeld kan worden, en bouwen aan een vertrouwensband die hen hoop en perspectief geeft.`},
   {match:['verbinden','samenwerken'],kleur:'#33a6c0',titel:'Pijler 4: Verbinden en samenwerken',tekst:`We verbinden het gezin actief met hun netwerk:

- Informeel: familie, vrienden, buren, ...
- Formeel: hulpverleners, diensten, ...

We brengen in kaart wie betekenisvol is en wie een ondersteunende rol kan opnemen. We versterken bestaande relaties, leggen nieuwe verbindingen en zorgen ervoor dat ze elkaar vinden. Samen met het gezin stemmen we af welke informatie er gedeeld wordt. Zo werken we transparant toe naar een gedragen en gedeelde aanpak en samenwerking.

**Wat streven we na?**

**1. Een zichtbaar netwerk rond het gezin**
In dialoog met het gezin brengen we hun netwerk in kaart. Dit helpt hen om de kracht en steun van hun eigen omgeving te (her)ontdekken. We versterken bestaande relaties en zorgen voor duidelijkheid: bij wie kan het gezin allemaal terecht en wie neemt welke rol op?

**2. Gedeelde verantwoordelijkheid en afstemming**
We stimuleren een nieuwe samenwerking tussen het gezin, hun netwerk en professionals. Via overleg, transparante informatie-uitwisseling en gezamenlijke besluitvorming worden verantwoordelijkheden helder en gedragen door alle betrokkenen, met het gezin steeds maximaal aan het stuur.

**3. Eén samenhangend en begrijpelijk plan**
Alle ondersteuning komt samen in één overzichtelijk plan dat aansluit bij de noden van het gezin. Hierdoor blijft de hulp helder, samenhangend en haalbaar.`},
   {match:['continu','tijdelijk'],kleur:'#2a7174',titel:'Pijler 5: Continuïteit en tijdelijkheid',tekst:`Continuïteit vraagt om een goede relationele afstemming en heldere afspraken tussen het gezin, hun netwerk en de betrokken diensten. Binnen onze vooropgestelde begeleidingstermijn werken we samen met het gezin aan haalbare en doelgerichte stappen. Vanaf de start kijken we vooruit en verbinden we tijdig het netwerk en de juiste diensten. Zo leggen we een basis waarop het gezin ook na afloop van onze begeleiding verder kan.

**Wat streven we na?**

**1. Overzicht**
Het gezin ervaart de ondersteuning als één samenhangend geheel. Wanneer er meerdere diensten of mensen betrokken zijn, is het helder wie wat doet en waar het gezin terechtkan met vragen.

**2. Doelgerichte vooruitgang**
Er is een duidelijke focus. Het gezin en de hulpverleners richten zich samen op wat nu prioritair is en zetten hier haalbare stappen in.

**3. Een sterke basis voor de toekomst**
Het gezin kan na het traject met vertrouwen verder, samen met de mensen die om hen heen blijven staan.`}

const KEY='reflectie_antwoorden';
const PIJLER_EERST=true;
/* ====== opslag ====== */
const load=()=>{try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}};
const save=a=>{try{localStorage.setItem(KEY,JSON.stringify(a));return true}catch(e){return false}};
/* ====== helpers ====== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=iso=>new Date(iso).toLocaleString('nl-BE',{day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'});
const norm=k=>String(k).toLowerCase().replace(/[^a-z]/g,'');
function pick(o,aliases){const keys=Object.keys(o);for(const a of aliases){const k=keys.find(k=>norm(k).includes(a));if(k&&String(o[k]).trim())return String(o[k]).trim()}return''}
function flat(n,path,out){
 if(Array.isArray(n)){
  if(n.length&&Array.isArray(n[0])){const h=n[0];n.slice(1).forEach(r=>out.push({row:Object.fromEntries(h.map((k,i)=>[k,r[i]])),path}))}
  else n.forEach(x=>{if(x&&typeof x==='object')out.push({row:x,path});else if(typeof x==='string'&&x.trim())out.push({row:{vraag:x},path})});
 }else if(n&&typeof n==='object'){
  const ent=Object.entries(n),w=ent.find(([k,v])=>/^(data|rows|items|vragen)$/i.test(k)&&Array.isArray(v));
  if(w)return flat(w[1],path,out);
  if(ent.some(([k,v])=>v&&typeof v==='object'))ent.forEach(([k,v])=>{if(v&&typeof v==='object')flat(v,[...path,k],out)});
  else out.push({row:n,path});
 }
}
/* Optioneel per kader in FRAMEWORKS: velden:{id:'Kolomnaam',vraag:'Kolomnaam',pijler:'Kolomnaam',categorie:'Kolomnaam'} om kolommen vast te leggen */
function parse(json,fw){
 const out=[];flat(json,[],out);
 const keys=[...new Set(out.flatMap(o=>Object.keys(o.row)))];
 const exact=n=>n&&keys.find(k=>norm(k)===norm(n));
 const find=al=>{for(const a of al){const k=keys.find(k=>norm(k).includes(a));if(k)return k}return null};
 const V=(fw&&fw.velden)||{};
 const kid=exact(V.id)||keys.find(k=>norm(k)==='id')||keys.find(k=>['vraagid','idvraag','questionid','idnummer'].includes(norm(k)))||null;
 const kq=exact(V.vraag)||find(['vraag','question','reflectie']);
 const kc=exact(V.categorie)||find(['categor','kwadrant','domein','thema']);
 let kp=exact(V.pijler)||find(['pijler','pilaar','pillar','dimensie','onderdeel']);
 if(!kp){ // kolom met verleden/toekomst (op naam of op inhoud)
  kp=find(['tijd','periode','perspectief','verleden','toekomst','richting','horizon']);
  if(!kp)kp=keys.find(k=>{if(k===kq||k===kc)return false;const v=out.map(o=>String(o.row[k]??'').trim()).filter(Boolean);
   return v.length&&v.filter(x=>/^(verleden|toekomst|heden|nu)\b/i.test(x)).length/v.length>=.5})||null;
 }
 return out.map(({row,path})=>{
  const g=k=>k&&row[k]!=null?String(row[k]).trim():'';
  let q=g(kq)||Object.values(row).map(String).sort((a,b)=>b.length-a.length)[0]||'';
  const A=g(kp)||path[0]||'',B=g(kc)||path[1]||'';
  let top=PIJLER_EERST?A:B,sub=PIJLER_EERST?B:A;
  if(!top){top=sub;sub=''}
  const vid=g(kid);
  return{id:vid,q:q.trim(),cat:top||'Algemeen',pil:sub}
 }).filter(x=>x.q&&x.id);   /* een vraag zonder UUID wordt nooit getoond */
}
/* ====== data: 1x ophalen, daarna op de achtergrond synchroniseren ====== */
const DATA={},P={};let lastSync=0;
(function(){FRAMEWORKS.forEach(fw=>{try{const c=JSON.parse(localStorage.getItem('reflectie_cache_'+fw.id));const ok=Array.isArray(c)?c.filter(x=>x&&x.id):[];if(ok.length)DATA[fw.id]=ok}catch(e){}})})();
function syncOne(fw){
 if(P[fw.id])return P[fw.id];
 return P[fw.id]=(async()=>{try{
  const r=await fetch(fw.url);if(!r.ok)throw new Error('http');
  const items=parse(await r.json(),fw);if(!items.length)throw new Error('leeg');
  DATA[fw.id]=items;
  try{localStorage.setItem('reflectie_cache_'+fw.id,JSON.stringify(items))}catch(e){}
  if(S.fw===fw){S.items=items;if(S.cur)S.cur=items.find(i=>same(i,S.cur))||S.cur}
  return items;
 }finally{delete P[fw.id]}})();
}
async function syncAll(){
 const res=await Promise.allSettled(FRAMEWORKS.filter(f=>f.url).map(syncOne));
 if(res.every(r=>r.status==='fulfilled'))lastSync=Date.now();
}
async function getData(fw){return DATA[fw.id]||await syncOne(fw)}
/* ====== state ====== */
let S={fw:null,items:[],cur:null,filter:{cat:null,pil:null},showInfo:false};
function setAccent(c){document.documentElement.style.setProperty('--accent',c||'#007a23')}

async function start(fw){
 if(fw.pagina){S.fromList=null;S.fw=fw;S.items=[];S.cur=null;S.filter={cat:null,pil:null};setAccent(fw.kleur);S.view='page';nav();return}
 S.fromList=null;S.fw=fw;setAccent(fw.kleur);if(!DATA[fw.id]){S.view='loading';render()}
 try{S.items=await getData(fw);S.filter={cat:null,pil:null};randomQ()}catch(e){S.view='error';render()}

const HKEY='reflectie_verborgen';
const loadH=()=>{try{return JSON.parse(localStorage.getItem(HKEY))||[]}catch(e){return[]}};
const saveH=a=>{try{localStorage.setItem(HKEY,JSON.stringify(a));return true}catch(e){return false}};
const qid=i=>String(i.id);   /* het UUID uit de API is rechtstreeks de sleutel */
const same=(a,b)=>!!a&&!!b&&a.id===b.id;
const isHidden=i=>loadH().includes(qid(i));
function hide(i){const h=loadH();if(!h.includes(qid(i)))h.push(qid(i));return saveH(h)}
function unhide(i){return saveH(loadH().filter(x=>x!==qid(i)))}
function pool(incl){const h=incl?[]:loadH();return S.items.filter(i=>(!S.filter.cat||i.cat===S.filter.cat)&&(!S.filter.pil||i.pil===S.filter.pil)&&!h.includes(qid(i)))}
function rich(t){const f=x=>esc(x).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
 return String(t).trim().split(/\n\s*\n/).map(a=>{const L=a.trim().split('\n');
  if(L.every(l=>/^\s*-\s+/.test(l)))return '<ul class="bl">'+L.map(l=>'<li>'+f(l.replace(/^\s*-\s+/,''))+'</li>').join('')+'</ul>';
  return '<p>'+L.map(f).join('<br>')+'</p>'}).join('')}
function pijlerInfoFor(...names){const L=S.fw.pijlerInfo||[];
 for(const n of names){if(!n)continue;const k=norm(n);const hit=L.find(x=>x.match.some(m=>k.includes(norm(m))));if(hit)return hit}return null}

 {const ta=$('#ans'),dr=loadD()[id];

/* ====== opslag beschermen, concepten en antwoorden aanpassen ====== */
async function beschermOpslag(){try{if(navigator.storage&&navigator.storage.persist&&!(await navigator.storage.persisted()))await navigator.storage.persist()}catch(e){}}
async function opslagStatus(){try{if(!(navigator.storage&&navigator.storage.persisted))return'';
 return (await navigator.storage.persisted())?'🔒 Opslag beschermd tegen automatisch opruimen.':''}catch(e){return''}}
const DKEY='reflectie_concepten';
const loadD=()=>{try{return JSON.parse(localStorage.getItem(DKEY))||{}}catch(e){return{}}};
function setDraft(id,t){try{const d=loadD();if(t&&t.trim())d[id]={t,d:new Date().toISOString()};else delete d[id];localStorage.setItem(DKEY,JSON.stringify(d))}catch(e){}}
const akey=a=>a.id+'@@'+a.date;
function updAnswer(k,fn){const all=load();const i=all.findIndex(a=>akey(a)===k);if(i<0)return false;fn(all,i);return save(all)}
function clampHt(root){root.querySelectorAll('.ht').forEach(t=>{
 if(t.scrollHeight<=t.clientHeight+1)return;
 const b=document.createElement('button');b.className='more';b.textContent='Toon meer ▾';
 b.onclick=()=>{const o=t.classList.toggle('open');b.textContent=o?'Toon minder ▴':'Toon meer ▾'};
 t.after(b)})}
function answerItem(a,opt){
 const k=akey(a),ed=S.editKey===k,del=S.delKey===k,f=FRAMEWORKS.find(x=>x.id===a.framework);
 const head=opt.full?`<div class="ahead"><b>${esc(a.question||'(vraag)')}</b>${f?`<span class="chip" style="background:${f.kleur}">${esc(f.naam)}</span>`:''}${a.category?`<span class="chip" style="background:${specialColor(a.category)||'var(--ink)'}">${esc(a.category)}</span>`:''}${a.pillar?`<span class="chip" style="background:${specialColor(a.pillar)||'var(--ink)'}">${esc(a.pillar)}</span>`:''}</div>`:'';
 return `<div class="hist ans" data-k="${esc(k)}">${head}<small>${fmt(a.date)}${a.edited?' · aangepast '+fmt(a.edited):''}</small>`+
  (ed?`<textarea class="editta">${esc(a.answer)}</textarea><div class="arow"><button class="btn sm" data-act="save">Opslaan</button><button class="btn alt sm" data-act="cancel">Annuleren</button></div>`
  :`<div class="ht">${esc(a.answer)}</div><div class="arow">`+(del
   ?`<span class="no">Dit antwoord verwijderen?</span><button class="btn sm danger" data-act="delyes">Ja, verwijder</button><button class="btn alt sm" data-act="cancel">Nee</button>`
   :`<button class="more" data-act="edit">✎ Aanpassen</button><button class="more" data-act="del">🗑 Verwijderen</button>`)+`</div>`)+`</div>`}
function wireAnswers(root,after){root.querySelectorAll('.ans [data-act]').forEach(b=>b.onclick=()=>{
 const box=b.closest('.ans'),k=box.dataset.k,act=b.dataset.act;
 const err=t=>{const o=box.querySelector('.aerr');if(o)o.remove();box.insertAdjacentHTML('beforeend',`<p class="err aerr">${t}</p>`)};
 if(act==='edit'){S.editKey=k;S.delKey=null;after()}
 else if(act==='del'){S.delKey=k;S.editKey=null;after()}
 else if(act==='cancel'){S.editKey=S.delKey=null;after()}
 else if(act==='save'){const ta=box.querySelector('.editta'),v=ta.value.trim();
  if(!v){ta.classList.add('bad');err('Een antwoord kan niet leeg zijn. Gebruik "Verwijderen" als je het niet wilt bewaren.');return}
  if(updAnswer(k,(all,i)=>{all[i].answer=v;all[i].edited=new Date().toISOString()})){S.editKey=null;after()}else err('Opslaan is mislukt (opslag geblokkeerd of vol).')}
 else if(act==='delyes'){if(updAnswer(k,(all,i)=>{all.splice(i,1)})){S.delKey=null;after()}else err('Verwijderen is mislukt (opslag geblokkeerd).')}
})}
function rerenderQ(){const t=$('#ans');const v=t?t.value:'';renderQuestion();if($('#ans'))$('#ans').value=v}
function renderAnswers(){
 const all=load().sort((a,b)=>b.date.localeCompare(a.date));
 const fws=FRAMEWORKS.filter(f=>all.some(a=>a.framework===f.id));
 if(S.af&&!fws.some(f=>f.id===S.af))S.af='';
 const q=norm(S.aq||'');
 const list=all.filter(a=>(!S.af||a.framework===S.af)&&(!q||norm([a.question,a.answer,a.category,a.pillar].join(' ')).includes(q)));
 $('#app').innerHTML=`<div class="card big"><h2>Mijn antwoorden</h2>
  <p class="muted" style="margin:0 0 4px">${all.length} ${all.length===1?'antwoord':'antwoorden'}, enkel bewaard op dit toestel.</p>
  ${all.length?`<input id="asearch" type="search" placeholder="Zoek in vragen en antwoorden…" value="${esc(S.aq||'')}" autocomplete="off">
  ${fws.length>1?`<div class="pick"><button class="btn sm${S.af?' alt':''}" data-f="">Alle kaders</button>${fws.map(f=>`<button class="btn sm${S.af===f.id?'':' alt'}" ${S.af===f.id?`style="background:${f.kleur}"`:''} data-f="${f.id}">${esc(f.naam)}</button>`).join('')}</div>`:''}`:'<p>Je hebt nog geen antwoorden bewaard. Beantwoord een vraag en je vindt ze hier terug.</p>'}</div>
  ${list.length?`<button class="btn alt sm" id="apdf" style="margin:0 0 8px">📄 Exporteren naar pdf${S.af||S.aq?' (huidige selectie)':''}</button>`:''}
  <div id="alist">${list.map(a=>`<div class="card" style="padding:12px 16px">${answerItem(a,{full:true})}</div>`).join('')||(all.length?'<p class="muted" style="text-align:center">Geen antwoorden gevonden.</p>':'')}</div>`;
 clampHt($('#app'));wireAnswers($('#app'),renderAnswers);
 if($('#apdf'))$('#apdf').onclick=()=>printAnswers(list,S.af?'Antwoorden: '+(FRAMEWORKS.find(f=>f.id===S.af)||{}).naam:'Mijn antwoorden');
 if($('#asearch'))$('#asearch').oninput=e=>{S.aq=e.target.value;const p=e.target.selectionStart;renderAnswers();const n=$('#asearch');n.focus();try{n.setSelectionRange(p,p)}catch(x){}};
 document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{S.af=b.dataset.f;renderAnswers()});
}
function openAnswers(){if(S.view==='answers')return;S.af='';S.aq='';S.view='answers';nav()}
/* ====== favorieten ====== */
const FKEY='reflectie_favorieten';
const loadF=()=>{try{const a=JSON.parse(localStorage.getItem(FKEY));return Array.isArray(a)?a.filter(f=>f&&typeof f.id==='string'):[]}catch(e){return[]}};
const saveF=a=>{try{localStorage.setItem(FKEY,JSON.stringify(a));return true}catch(e){return false}};
const isFav=id=>loadF().some(f=>f.id===id);
function toast(t){const e=$('#toast');if(!e)return;e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2200)}
const STAR=on=>`<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.1l-5.7 3.2 1.2-6.4L2.8 9.5l6.4-.8z" fill="${on?'#ec9801':'none'}" stroke="#ec9801" stroke-width="1.8" stroke-linejoin="round"/></svg>`;
const starLabel=on=>on?'Verwijder uit favorieten':'Voeg toe aan favorieten';
const starBtn=(id,fw,top)=>{const on=isFav(id);return `<button class="star${top?' top':''}" data-fav="${esc(id)}" data-fw="${esc(fw)}" aria-pressed="${on}" aria-label="${starLabel(on)}" title="${starLabel(on)}">${STAR(on)}</button>`};
function toggleFav(id,fw){const a=loadF(),i=a.findIndex(f=>f.id===id);let on;
 if(i>=0){a.splice(i,1);on=false}else{a.push({id,fw,date:new Date().toISOString()});on=true}
 if(!saveF(a)){toast('Opslaan mislukt (opslag geblokkeerd of vol)');return null}
 toast(on?'Toegevoegd aan favorieten':'Verwijderd uit favorieten');return on}
function wireStars(root,after){root.querySelectorAll('[data-fav]').forEach(b=>b.onclick=e=>{e.stopPropagation();
 const on=toggleFav(b.dataset.fav,b.dataset.fw);if(on===null)return;
 if(after)after();else{b.setAttribute('aria-pressed',String(on));b.setAttribute('aria-label',starLabel(on));b.title=starLabel(on);b.innerHTML=STAR(on)}})}
async function renderFavs(){
 const favs=loadF().sort((a,b)=>(b.date||'').localeCompare(a.date||''));
 const need=[...new Set(favs.map(f=>f.fw))].map(id=>FRAMEWORKS.find(x=>x.id===id)).filter(f=>f&&f.url&&!DATA[f.id]);
 if(need.length){$('#app').innerHTML='<div class="card"><h2>Favorieten laden…</h2></div>';await Promise.allSettled(need.map(getData));if(S.view!=='favs')return}
 const rows=favs.map(f=>{const fw=FRAMEWORKS.find(x=>x.id===f.fw);return{f,fw,it:fw&&(DATA[fw.id]||[]).find(i=>qid(i)===f.id)}});
 $('#app').innerHTML=`<div class="card big"><h2>Favoriete vragen</h2>
  <p class="muted" style="margin:0">${favs.length?`${favs.length} ${favs.length===1?'vraag':'vragen'}. Tik op de ster om een vraag uit je favorieten te halen.`:'Je hebt nog geen favoriete vragen. Tik op het sterretje bij een vraag om ze hier te bewaren.'}</p></div>
  <div>${rows.map((r,n)=>r.it
   ?`<div class="qrow"><button class="qitem" data-o="${n}">${esc(r.it.q)}<small>${esc(r.fw.naam)} · ${esc(r.it.cat)}${r.it.pil?' · '+esc(r.it.pil):''}</small></button>${starBtn(r.f.id,r.f.fw)}</div>`
   :`<div class="qrow off"><div class="qitem off">Deze vraag is niet meer beschikbaar<small>${r.fw?esc(r.fw.naam):''}</small></div>${starBtn(r.f.id,r.f.fw)}</div>`).join('')}</div>`;
 wireStars($('#app'),renderFavs);
 document.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{const r=rows[+b.dataset.o];
  S.fw=r.fw;S.items=DATA[r.fw.id];S.filter={cat:null,pil:null};S.fromList=null;S.cur=r.it;S.showInfo=false;S.msg=null;setAccent(r.fw.kleur);S.view='question';nav()});
}
function openFavs(){if(S.view==='favs')return;S.view='favs';nav()}
/* ====== exporteren naar pdf (via het afdrukvenster) ====== */
function printAnswers(list,titel){
 let box=$('#printArea');if(!box){box=document.createElement('div');box.id='printArea';document.body.appendChild(box)}
 const fwn=id=>{const f=FRAMEWORKS.find(x=>x.id===id);return f?f.naam:''};
 box.innerHTML=`<h1>Kern•m•app</h1><h2>${esc(titel)}</h2><p class="pm">Geëxporteerd op ${esc(fmt(new Date().toISOString()))} · ${list.length} ${list.length===1?'antwoord':'antwoorden'}</p>`+
  list.map(a=>`<div class="pi"><div class="pq">${esc(a.question||'')}</div><div class="pc">${[fwn(a.framework),a.category,a.pillar].filter(Boolean).map(esc).join(' · ')}</div><div class="pd">${esc(fmt(a.date))}${a.edited?' · aangepast '+esc(fmt(a.edited)):''}</div><div class="pa">${esc(a.answer)}</div></div>`).join('');
 const old=document.title;document.title='Kern-m-app-antwoorden-'+new Date().toISOString().slice(0,10);
 const done=()=>{document.title=old;window.removeEventListener('afterprint',done)};window.addEventListener('afterprint',done);
 setTimeout(()=>{try{window.print()}catch(e){done()}},150)}
/* ====== back-up: exporteren en importeren ====== */
function backupSummary(){return''}
function bkMsg(t,ok){const e=$('#bkmsg');if(e)e.innerHTML=`<p class="${ok?'ok':'no'}">${esc(t)}</p>`}
function makeBackup(){return{app:'kernmapp',versie:1,geexporteerd:new Date().toISOString(),antwoorden:load(),verborgen:loadH(),favorieten:loadF()}}
async function doExport(){
 const data=makeBackup();
 if(!data.antwoorden.length&&!data.verborgen.length&&!data.favorieten.length){bkMsg('Er is nog niets om te exporteren.',false);return}
 const name='kernmapp-back-up-'+new Date().toISOString().slice(0,10)+'.json';
 const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
 try{
  const file=new File([blob],name,{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[file]})&&/Android|iPhone|iPad/i.test(navigator.userAgent)){
   try{await navigator.share({files:[file],title:'Kern•m•app back-up'});bkMsg('Back-up gedeeld.',true);return}
   catch(e){if(e&&e.name==='AbortError')return}
  }
 }catch(e){}
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(u),4000);
 bkMsg(`Back-up gemaakt: ${data.antwoorden.length} ${data.antwoorden.length===1?'antwoord':'antwoorden'} in ${name}.`,true);
}
function doImport(text){
 let d;try{d=JSON.parse(text)}catch(e){bkMsg('Dit bestand kan niet gelezen worden. Kies een back-upbestand van Kern•m•app.',false);return}
 const list=Array.isArray(d)?d:d&&d.antwoorden;
 if(!Array.isArray(list)){bkMsg('Dit lijkt geen back-upbestand van Kern•m•app.',false);return}
 const valid=list.filter(a=>a&&typeof a.id==='string'&&typeof a.answer==='string'&&a.answer.trim()&&typeof a.date==='string'&&!isNaN(Date.parse(a.date)));
 const key=a=>a.id+'\u0001'+a.date+'\u0001'+a.answer;
 const cur=load(),have=new Set(cur.map(key));let added=0;
 valid.forEach(a=>{if(!have.has(key(a))){have.add(key(a));cur.push({id:a.id,framework:a.framework||a.id.split('|')[0],question:a.question||a.id.split('|').slice(1).join('|'),category:a.category||'',pillar:a.pillar||'',answer:a.answer,date:a.date,...(typeof a.edited==='string'?{edited:a.edited}:{})});added++}});
 const hs=Array.isArray(d.verborgen)?d.verborgen.filter(x=>typeof x==='string'):[];
 const hcur=loadH(),hset=new Set(hcur);let hadded=0;
 hs.forEach(x=>{if(!hset.has(x)){hset.add(x);hcur.push(x);hadded++}});
 const fs=Array.isArray(d.favorieten)?d.favorieten.filter(x=>x&&typeof x.id==='string'&&typeof x.fw==='string'):[];
 const fcur=loadF(),fset=new Set(fcur.map(x=>x.id));let fadded=0;
 fs.forEach(x=>{if(!fset.has(x.id)){fset.add(x.id);fcur.push({id:x.id,fw:x.fw,date:typeof x.date==='string'?x.date:new Date().toISOString()});fadded++}});
 if(!save(cur)||!saveH(hcur)||!saveF(fcur)){bkMsg('Opslaan is mislukt (opslag geblokkeerd of vol).',false);return} 
 const skipped=list.length-valid.length,dup=valid.length-added;
 bkMsg(`Import klaar: ${added} nieuwe ${added===1?'antwoord':'antwoorden'} toegevoegd`+(hadded?`, ${hadded} verborgen ${hadded===1?'vraag':'vragen'} toegevoegd`:'')+(fadded?`, ${fadded} ${fadded===1?'favoriet':'favorieten'} toegevoegd`:'')+(dup?`, ${dup} stonden er al`:'')+(skipped?`, ${skipped} overgeslagen (ongeldig)`:'')+'.',true);
 const sm=$('#menuSum');if(sm)sm.textContent=backupSummary();
}
function initMenu(){
 const g=$('#gearBtn'),m=$('#menu'),fi=$('#impFile');
 const close=()=>{m.hidden=true;g.setAttribute('aria-expanded','false')};
 g.onclick=e=>{e.stopPropagation();const open=m.hidden;
  if(open){$('#bkmsg').innerHTML='';$('#menuSum').textContent=backupSummary();opslagStatus().then(t=>{$('#menuPersist').textContent=t})}
  m.hidden=!open;g.setAttribute('aria-expanded',String(open))};
 m.onclick=e=>e.stopPropagation();
 document.addEventListener('click',close);
 document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
 $('#mine').onclick=()=>{close();openAnswers()};
 $('#favs').onclick=()=>{close();openFavs()};
 $('#exp').onclick=()=>{
  $('#bkmsg').innerHTML=`<div class="mh" style="padding-left:12px">Wat wil je doen?</div>
   <button class="xopt" id="xpdf"><b>📄 Exporteren naar pdf</b><small>Een leesbaar document om te bewaren of te delen.</small></button>
   <button class="xopt" id="xdev"><b>📱 Overzetten naar een nieuw toestel</b><small>Een back-upbestand dat je op het andere toestel importeert.</small></button>
   <button class="xno" id="xno">Annuleren</button>`;
  $('#xno').onclick=()=>{$('#bkmsg').innerHTML=''};
  $('#xdev').onclick=doExport;
  $('#xpdf').onclick=()=>{const a=load().sort((x,y)=>y.date.localeCompare(x.date));
   if(!a.length){bkMsg('Er zijn nog geen antwoorden om te exporteren.',false);return}
   close();printAnswers(a,'Mijn antwoorden')};
 };
 $('#unh').onclick=()=>{
  const n=loadH().length;
  if(!n){bkMsg('Er zijn geen verborgen vragen.',false);return}
  if(!saveH([])){bkMsg('Terugzetten is mislukt (opslag geblokkeerd of vol).',false);return}
  bkMsg(`${n} verborgen ${n===1?'vraag':'vragen'} teruggezet. Ze komen weer voor in de random vragen en overzichten.`,true);
  $('#menuSum').textContent=backupSummary();
 };
 $('#wipe').onclick=()=>{
  const a=load().length,h=loadH().length,fv=loadF().length;
  if(!a&&!h&&!fv){bkMsg('Er is niets om te wissen.',false);return}
  $('#bkmsg').innerHTML=`<p class="no">Alle ${a} ${a===1?'antwoord':'antwoorden'} ${fv?`, ${fv} ${fv===1?'favoriet':'favorieten'}`:''} en ${h} verborgen ${h===1?'vraag':'vragen'} op dit toestel worden definitief gewist. Dit kan niet ongedaan gemaakt worden. Exporteer eerst een back-up als je ze wil bewaren.</p><div class="mconf"><button class="nee" id="wno">Annuleren</button><button class="yes" id="wyes">Ja, wis alles</button></div>`;
  $('#wno').onclick=()=>{$('#bkmsg').innerHTML=''};
  $('#wyes').onclick=()=>{
   try{localStorage.removeItem(KEY);localStorage.removeItem(HKEY);localStorage.removeItem(DKEY);localStorage.removeItem(FKEY)}catch(e){bkMsg('Wissen is mislukt (opslag geblokkeerd).',false);return}
   bkMsg('Alle antwoorden en verborgen vragen zijn gewist.',true);
   $('#menuSum').textContent=backupSummary();
   render();
  };
 };
 $('#imp').onclick=()=>fi.click();
 fi.onchange=()=>{const f=fi.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{doImport(String(r.result));fi.value=''};
  r.onerror=()=>bkMsg('Het bestand kon niet gelezen worden.',false);r.readAsText(f)};
}
/* ====== PWA: manifest + iconen worden hier gegenereerd (alles in 1 bestand) ====== */
function drawIcon(size,maskable){
 const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d'),m=size/2,k=maskable?.78:1;
 x.fillStyle='#007a23';
 if(maskable)x.fillRect(0,0,size,size);else{const r=size*.22;x.beginPath();x.roundRect?x.roundRect(0,0,size,size,r):x.rect(0,0,size,size);x.fill()}
 x.strokeStyle='#f3f3f3';x.lineWidth=size*.045*k;
 [0,60,120].forEach(a=>{x.beginPath();x.ellipse(m,m,size*.34*k,size*.13*k,a*Math.PI/180,0,Math.PI*2);x.stroke()});
 const R=size*.34*k,d=(a,sg)=>[m+sg*R*Math.cos(a*Math.PI/180),m+sg*R*Math.sin(a*Math.PI/180)];
 x.lineWidth=size*.012*k;x.strokeStyle='#f3f3f3';
 [[d(60,-1),'#d64b37'],[d(120,-1),'#ec9801'],[d(0,1),'#33a6c0'],[d(120,1),'#2a7174']].forEach(([p,c])=>{x.beginPath();x.arc(p[0],p[1],size*.042*k,0,Math.PI*2);x.fillStyle=c;x.fill();x.stroke()});
 x.beginPath();x.arc(m,m,size*.065*k,0,Math.PI*2);x.fillStyle='#007a23';x.fill();x.lineWidth=size*.018*k;x.stroke();
 return c.toDataURL('image/png');
}
(function(){
 try{
  const i192=drawIcon(192),i512=drawIcon(512),iMask=drawIcon(512,true);
  const a=document.createElement('link');a.rel='apple-touch-icon';a.href=drawIcon(180,true);document.head.appendChild(a);
  const f=document.createElement('link');f.rel='icon';f.href=i192;document.head.appendChild(f);
  const base=location.href.split('#')[0].split('?')[0];
  const man={name:'Kern•m•app',short_name:'Kern•m•app',description:'Reflectievragen vanuit theoretische kaders',
   start_url:base,scope:new URL('./',base).href,display:'standalone',orientation:'any',lang:'nl',
   background_color:'#eae8d8',theme_color:'#007a23',
   icons:[{src:i192,sizes:'192x192',type:'image/png',purpose:'any'},{src:i512,sizes:'512x512',type:'image/png',purpose:'any'},{src:iMask,sizes:'512x512',type:'image/png',purpose:'maskable'}]};
  const l=document.createElement('link');l.rel='manifest';
  l.href=URL.createObjectURL(new Blob([JSON.stringify(man)],{type:'application/manifest+json'}));document.head.appendChild(l);
 }catch(e){}
 if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
 window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();DP=e;showInstall()});
 window.addEventListener('appinstalled',()=>{DP=null;const b=$('#installBtn');if(b)b.remove()});
})();
initMenu();
render();
beschermOpslag();
syncAll();
setInterval(syncAll,10*60*1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-lastSync>5*60*1000)syncAll()});
window.addEventListener('online',syncAll);
</script>
